    <path d="M54 54 L78 84" stroke="#09281E" stroke-width="8" stroke-linecap="round" />
    <path d="M84 28 L86.5 35.5 L94 38 L86.5 40.5 L84 48 L81.5 40.5 L74 38 L81.5 35.5 Z" fill="url(#logo-white-gold-acc)" />
  </g>

  <!-- Brand Name Typography (Crisp White) -->
  <g transform="translate(76, 42)">
